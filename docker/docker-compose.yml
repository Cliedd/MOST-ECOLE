version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: mostecole_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mostecole_db
      POSTGRES_USER:     mostecole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mostecole -d mostecole_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mostecole_net

  # ── Spring Boot backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: mostecole_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:     prod
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/mostecole_db
      SPRING_DATASOURCE_USERNAME: mostecole
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      JWT_SECRET:                 ${JWT_SECRET}
      JWT_EXPIRATION_MS:          ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS:       ${CORS_ALLOWED_ORIGINS:-http://localhost}
    ports:
      - "8080:8080"
    networks:
      - mostecole_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── React frontend (nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: /api
    container_name: mostecole_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - mostecole_net

volumes:
  postgres_data:

networks:
  mostecole_net:
    driver: bridge
